name: Build launcher APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Outline text, icons and header position
        run: |
          python3 - <<'PY'
          import re, sys, os
          base = "launcher/app/src/main/"
          res = base + "res/"
          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()
          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)

          # 1. two tiny views: a crisp black outline (stroked text), then the text itself in solid colour on top
          jdir = base + "java/com/gathin/tvhome/"
          def java_source(name, parent):
              lines = [
                  "package com.gathin.tvhome;",
                  "",
                  "import android.content.Context;",
                  "import android.content.res.ColorStateList;",
                  "import android.graphics.Canvas;",
                  "import android.graphics.Paint;",
                  "import android.util.AttributeSet;",
                  "import android.widget.%s;" % parent,
                  "",
                  "/** %s that draws a hard black outline around its text, then the text in solid colour on top. */" % parent,
                  "public class %s extends %s {" % (name, parent),
                  "    private boolean outlining;",
                  "",
                  "    public %s(Context context) { super(context); }" % name,
                  "    public %s(Context context, AttributeSet attrs) { super(context, attrs); }" % name,
                  "    public %s(Context context, AttributeSet attrs, int defStyleAttr) { super(context, attrs, defStyleAttr); }" % name,
                  "",
                  "    /** The colour swaps in onDraw must not ask for another frame, or the view would redraw forever. */",
                  "    @Override",
                  "    public void invalidate() {",
                  "        if (!outlining) super.invalidate();",
                  "    }",
                  "",
                  "    @Override",
                  "    protected void onDraw(Canvas canvas) {",
                  "        Paint paint = getPaint();",
                  "        ColorStateList colors = getTextColors();",
                  "        int fill = getCurrentTextColor() | 0xFF000000;",
                  "        outlining = true;",
                  "        try {",
                  "            paint.setStyle(Paint.Style.STROKE);",
                  "            paint.setStrokeJoin(Paint.Join.ROUND);",
                  "            paint.setStrokeWidth(3f + paint.getTextSize() * 0.04f);",
                  "            setTextColor(0xFF000000);",
                  "            super.onDraw(canvas);",
                  "            paint.setStyle(Paint.Style.FILL);",
                  "            setTextColor(fill);",
                  "            super.onDraw(canvas);",
                  "        } finally {",
                  "            setTextColor(colors);",
                  "            outlining = false;",
                  "        }",
                  "    }",
                  "}",
                  "",
              ]
              return "\n".join(lines)
          write(jdir + "OutlineTextView.java", java_source("OutlineTextView", "TextView"))
          write(jdir + "OutlineTextClock.java", java_source("OutlineTextClock", "TextClock"))

          # 2. header texts: same views, new class; the date smaller
          path = res + "layout/activity_main.xml"
          s = read(path)
          targets = {"greeting": "TextView", "clock": "TextClock", "ampm": "TextClock", "date": "TextClock",
                     "heroName": "TextView", "heroMeta": "TextView"}
          for name, tag in targets.items():
              key = 'android:id="@+id/%s"' % name
              pos = s.find(key)
              if pos < 0:
                  sys.exit("PATCH FAILED: %s not found" % name)
              start = s.rfind("<", 0, pos)
              end = s.find(">", pos)
              block = s[start:end]
              if not block.startswith("<" + tag) or not block.rstrip().endswith("/"):
                  sys.exit("PATCH FAILED: unexpected shape for %s" % name)
              new = "<com.gathin.tvhome.Outline" + block[1:]
              if name == "date":
                  new, n = re.subn(r'android:textSize="\d+sp"', 'android:textSize="12sp"', new)
                  if n != 1:
                      sys.exit("PATCH FAILED: date size")
              s = s[:start] + new + s[end:]
          anchor = 'android:paddingTop="26dp"'
          if s.count(anchor) != 1:
              sys.exit("PATCH FAILED: header anchor")
          i = s.find(anchor)
          j = s.find("<RelativeLayout", i)
          if j < 0 or j - i > 600:
              sys.exit("PATCH FAILED: header row not found")
          s = s[:j] + '<RelativeLayout android:layout_marginStart="-32dp" android:layout_marginEnd="-32dp" android:layout_marginTop="-14dp"' + s[j + len("<RelativeLayout"):]
          write(path, s)

          # 3. top-bar icons: black outline path under the white one; multiply tint keeps both colours
          for icon in ["ic_input", "ic_settings", "ic_wifi", "ic_ethernet"]:
              p = res + "drawable/%s.xml" % icon
              t = read(p)
              m = re.search(r'<path android:fillColor="#FFFFFFFF"\s+android:pathData="([^"]+)"\s*/>', t)
              if not m:
                  sys.exit("PATCH FAILED: %s has an unexpected shape" % icon)
              d = m.group(1)
              new = ('<group android:scaleX="0.88" android:scaleY="0.88" android:pivotX="12" android:pivotY="12">\n'
                     '        <path android:fillColor="#FF000000" android:strokeColor="#FF000000" android:strokeWidth="1.8"\n'
                     '            android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="%s" />\n'
                     '        <path android:fillColor="#FFFFFFFF" android:pathData="%s" />\n'
                     '    </group>') % (d, d)
              write(p, t[:m.start()] + new + t[m.end():])
          sp = res + "values/styles.xml"
          st = read(sp)
          anchor = '<item name="android:drawableTint">@drawable/pill_text</item>'
          if st.count(anchor) != 1:
              sys.exit("PATCH FAILED: style anchor")
          write(sp, st.replace(anchor, anchor + '\n        <item name="android:drawableTintMode">multiply</item>'))
          print("outline patch applied")
          PY
      - name: Wallpaper button
        run: |
          python3 - <<'PY'
          import sys

          base = "launcher/app/src/main/"
          res = base + "res/"
          jdir = base + "java/com/gathin/tvhome/"


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          # 1. picture icon, same black outline + white fill as the other top-bar icons
          PICTURE = "M21,19V5c0,-1.1 -0.9,-2 -2,-2H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5l3.5,-4.5z"
          write(res + "drawable/ic_wallpaper.xml", "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"',
              '    android:width="22dp" android:height="22dp"',
              '    android:viewportWidth="24" android:viewportHeight="24">',
              '    <group android:scaleX="0.88" android:scaleY="0.88" android:pivotX="12" android:pivotY="12">',
              '        <path android:fillColor="#FF000000" android:strokeColor="#FF000000" android:strokeWidth="1.8"',
              '            android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="%s" />' % PICTURE,
              '        <path android:fillColor="#FFFFFFFF" android:pathData="%s" />' % PICTURE,
              '    </group>',
              '</vector>',
              '',
          ]))

          # 2. layout: the old (hidden) reorder pill becomes the wallpaper pill, moved in front of the Sources pill
          lp = res + "layout/activity_main.xml"
          s = read(lp)
          rid = 'android:id="@+id/btnReorder"'
          i = s.find(rid)
          start = s.rfind("<TextView", 0, i)
          end = s.find("/>", i) + 2
          if i < 0 or start < 0 or end < 2:
              sys.exit("PATCH FAILED: reorder pill not found")
          block = s[start:end]
          block = once(block, "@drawable/ic_swap_vert", "@drawable/ic_wallpaper", "reorder icon")
          s = s[:start] + s[end:]
          iid = 'android:id="@+id/btnInputs"'
          j = s.find(iid)
          istart = s.rfind("<TextView", 0, j)
          if j < 0 or istart < 0:
              sys.exit("PATCH FAILED: inputs pill not found")
          s = s[:istart] + block + "\n\n                " + s[istart:]
          write(lp, s)

          # 3. MainActivity: the pill opens the launcher's own wallpaper picker
          jp = jdir + "MainActivity.java"
          t = read(jp)
          t = once(t,
                   "        btnReorder.setOnClickListener(v -> toggleReorder());\n"
                   "        btnReorder.setVisibility(cfg.reorderButton ? View.VISIBLE : View.GONE);",
                   r'''        btnReorder.setOnClickListener(v -> startActivityForResult(
                          new Intent(this, LauncherSettingsActivity.class)
                                  .putExtra(LauncherSettingsActivity.EXTRA_WALLPAPER_ONLY, true),
                          LAUNCHER_SETTINGS_REQUEST));
                  btnReorder.setVisibility(View.VISIBLE);
                  btnReorder.setContentDescription("Fond d'ecran");''',
                   "reorder click")
          t = once(t,
                   "int firstButton = btnInputs.getVisibility() == View.VISIBLE ? R.id.btnInputs : firstTopButton().getId();",
                   "int firstButton = R.id.btnReorder;",
                   "first button")
          write(jp, t)

          # 4. LauncherSettingsActivity: opened for the wallpaper only, it shows the picker at once and closes after it
          sp = jdir + "LauncherSettingsActivity.java"
          u = read(sp)
          u = once(u,
                   'static final String EXTRA_REORDER = "com.gathin.tvhome.extra.REORDER_FROM_SETTINGS";',
                   'static final String EXTRA_REORDER = "com.gathin.tvhome.extra.REORDER_FROM_SETTINGS";\n'
                   '    static final String EXTRA_WALLPAPER_ONLY = "com.gathin.tvhome.extra.WALLPAPER_ONLY";\n'
                   '    private boolean pickerOnly;',
                   "settings constant")
          u = once(u,
                   "wallpaperChoice.setOnClickListener(v -> showWallpaperPicker());",
                   "wallpaperChoice.setOnClickListener(v -> showWallpaperPicker());\n"
                   "        pickerOnly = getIntent().getBooleanExtra(EXTRA_WALLPAPER_ONLY, false);\n"
                   "        if (pickerOnly) wallpaperChoice.post(this::showWallpaperPicker);",
                   "settings picker start")
          u = once(u,
                   ".setTitle(R.string.wallpaper_label)",
                   ".setTitle(R.string.wallpaper_label)\n"
                   "                .setOnDismissListener(d -> { if (pickerOnly) finish(); })",
                   "settings picker dismiss")
          write(sp, u)
          print("wallpaper patch applied")
          PY
      - name: Wi-Fi popup
        run: |
          python3 - <<'PY'
          import sys

          base = "launcher/app/src/main/"
          res = base + "res/"
          jdir = base + "java/com/gathin/tvhome/"


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          # 1. WifiBars: four rising signal bars that follow the row's focus colours
          write(jdir + "WifiBars.java", """package com.gathin.tvhome;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.util.AttributeSet;
          import android.view.View;

          /** Four rising signal bars: the first `level` are solid, the rest faint. White, dark while the row is focused. */
          public class WifiBars extends View {
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();
              private int level = 4;

              public WifiBars(Context context) {
                  this(context, null);
              }

              public WifiBars(Context context, AttributeSet attrs) {
                  super(context, attrs);
              }

              public void setLevel(int level) {
                  this.level = Math.max(0, Math.min(4, level));
                  invalidate();
              }

              @Override
              protected void drawableStateChanged() {
                  super.drawableStateChanged();
                  invalidate();
              }

              private boolean focusedState() {
                  for (int s : getDrawableState()) {
                      if (s == android.R.attr.state_focused) return true;
                  }
                  return false;
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  boolean dark = focusedState();
                  int solid = dark ? 0xFF111111 : 0xFFFFFFFF;
                  int faint = dark ? 0x33111111 : 0x44FFFFFF;
                  float w = getWidth(), h = getHeight();
                  float gap = w * 0.12f;
                  float barW = (w - 3 * gap) / 4f;
                  float[] heights = {0.38f, 0.60f, 0.80f, 1.00f};
                  for (int i = 0; i < 4; i++) {
                      float left = i * (barW + gap);
                      float top = h * (1f - heights[i]);
                      rect.set(left, top, left + barW, h);
                      paint.setColor(i < level ? solid : faint);
                      canvas.drawRoundRect(rect, barW * 0.3f, barW * 0.3f, paint);
                  }
              }
          }
          """)

          # 2. layouts: a network row, the caption line and the header with the connected network
          FONT_M = '@string/font_medium'
          FONT_B = '@string/font_body'
          write(res + "layout/item_wifi.xml", """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="42dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingStart="12dp"
              android:paddingEnd="12dp"
              android:background="@drawable/input_row_bg"
              android:focusable="true"
              android:clickable="true">

              <com.gathin.tvhome.WifiBars
                  android:id="@+id/wifiRowBars"
                  android:layout_width="20dp"
                  android:layout_height="16dp"
                  android:duplicateParentState="true" />

              <TextView
                  android:id="@+id/wifiRowTitle"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:layout_marginStart="10dp"
                  android:layout_marginEnd="12dp"
                  android:textColor="@drawable/pill_text"
                  android:duplicateParentState="true"
                  android:textSize="15sp"
                  android:fontFamily="%s"
                  android:singleLine="true" />

              <ImageView
                  android:id="@+id/wifiRowLock"
                  android:layout_width="12dp"
                  android:layout_height="12dp"
                  android:layout_marginEnd="8dp"
                  android:src="@drawable/ic_lock"
                  android:tint="@drawable/pill_text_dim"
                  android:duplicateParentState="true"
                  android:contentDescription="@null" />

              <TextView
                  android:id="@+id/wifiRowStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="@drawable/pill_text_dim"
                  android:duplicateParentState="true"
                  android:textSize="11sp"
                  android:fontFamily="%s"
                  android:letterSpacing="0.04" />
          </LinearLayout>
          """ % (FONT_M, FONT_B))

          write(res + "layout/item_wifi_caption.xml", """<?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:paddingStart="12dp"
              android:paddingEnd="12dp"
              android:paddingTop="8dp"
              android:paddingBottom="6dp"
              android:textColor="#73FFFFFF"
              android:textSize="11sp"
              android:fontFamily="%s"
              android:letterSpacing="0.06" />
          """ % FONT_B)

          write(res + "layout/popup_wifi_header.xml", """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:paddingStart="12dp"
              android:paddingEnd="12dp"
              android:paddingTop="10dp"
              android:paddingBottom="6dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <com.gathin.tvhome.WifiBars
                      android:id="@+id/wifiHeadBars"
                      android:layout_width="24dp"
                      android:layout_height="19dp" />

                  <ImageView
                      android:id="@+id/wifiHeadIcon"
                      android:layout_width="22dp"
                      android:layout_height="22dp"
                      android:src="@drawable/ic_ethernet"
                      android:tint="#FFFFFFFF"
                      android:visibility="gone"
                      android:contentDescription="@null" />

                  <TextView
                      android:id="@+id/wifiHeadName"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:layout_marginEnd="12dp"
                      android:textColor="#FFFFFFFF"
                      android:textSize="18sp"
                      android:fontFamily="%s"
                      android:singleLine="true" />

                  <View
                      android:id="@+id/wifiHeadDot"
                      android:layout_width="7dp"
                      android:layout_height="7dp"
                      android:layout_marginEnd="8dp"
                      android:background="@drawable/status_dot" />

                  <TextView
                      android:id="@+id/wifiHeadState"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#99FFFFFF"
                      android:textSize="11sp"
                      android:fontFamily="%s"
                      android:letterSpacing="0.04" />
              </LinearLayout>

              <TextView
                  android:id="@+id/wifiHeadDetails"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="36dp"
                  android:layout_marginTop="4dp"
                  android:textColor="#A6FFFFFF"
                  android:textSize="12sp"
                  android:fontFamily="%s"
                  android:lineSpacingExtra="2dp" />
          </LinearLayout>
          """ % (FONT_M, FONT_B, FONT_B))

          # 3. MainActivity: the Wi-Fi pill (and the gear menu's Network row) open the popup
          mp = jdir + "MainActivity.java"
          s = read(mp)
          s = once(s, "btnWifi.setOnClickListener(v -> openNetworkPill());",
                   "btnWifi.setOnClickListener(v -> onNetworkPill());", "wifi pill click")
          s = once(s, "R.string.quick_network), -1, this::openNetworkPill);",
                   "R.string.quick_network), -1, this::onNetworkPill);", "menu network row")

          BLOCK = r'''    // ---- Wi-Fi popup: the connected network, its signal, and the networks around ------------------------

              /** Wi-Fi pill: a configured VPN app still wins, otherwise the popup. */
              private void onNetworkPill() {
                  if (!vpnPill && vpnAppIntent() != null) {
                      openNetworkPill();
                      return;
                  }
                  showWifiPopup();
              }

              /** French when the TV is set to French, English otherwise. */
              private String wifiText(String fr, String en) {
                  return "fr".equals(Locale.getDefault().getLanguage()) ? fr : en;
              }

              private static String wifiBand(int mhz) {
                  if (mhz <= 0) return "";
                  if (mhz < 3000) return "2,4 GHz";
                  if (mhz < 5900) return "5 GHz";
                  return "6 GHz";
              }

              private static String wifiIpv4(ConnectivityManager cm, Network net) {
                  try {
                      android.net.LinkProperties lp = cm.getLinkProperties(net);
                      if (lp == null) return null;
                      for (android.net.LinkAddress la : lp.getLinkAddresses()) {
                          java.net.InetAddress a = la.getAddress();
                          if (a instanceof java.net.Inet4Address && !a.isLoopbackAddress()) return a.getHostAddress();
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }

              private String wifiQuality(int level) {
                  String[] fr = {"Très faible", "Faible", "Moyen", "Bon", "Excellent"};
                  String[] en = {"Very weak", "Weak", "Fair", "Good", "Excellent"};
                  int i = Math.max(0, Math.min(4, level));
                  return wifiText(fr[i], en[i]);
              }

              private void showWifiPopup() {
                  boolean underGear = topMenu;
                  View anchor = underGear || btnWifi.getVisibility() != View.VISIBLE ? findViewById(R.id.btnSettings) : btnWifi;
                  View panel = getLayoutInflater().inflate(R.layout.popup_inputs, root, false);
                  LinearLayout rows = panel.findViewById(R.id.rows);
                  final PopupWindow popup = glassPopup(panel, (int) (340 * density));

                  WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  boolean wifiUp = false, ethUp = false;
                  String wifiIp = null, ethIp = null;
                  try {
                      for (Network net : cm != null ? cm.getAllNetworks() : new Network[0]) {
                          NetworkCapabilities caps = cm.getNetworkCapabilities(net);
                          if (caps == null || caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) continue;
                          if (!caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)) continue;
                          if (caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)) {
                              ethUp = true;
                              ethIp = wifiIpv4(cm, net);
                          }
                          if (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                              wifiUp = true;
                              wifiIp = wifiIpv4(cm, net);
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  // Header: what the TV is connected to right now.
                  View head = getLayoutInflater().inflate(R.layout.popup_wifi_header, rows, false);
                  WifiBars headBars = head.findViewById(R.id.wifiHeadBars);
                  View headIcon = head.findViewById(R.id.wifiHeadIcon);
                  TextView headName = head.findViewById(R.id.wifiHeadName);
                  View headDot = head.findViewById(R.id.wifiHeadDot);
                  TextView headState = head.findViewById(R.id.wifiHeadState);
                  TextView headDetails = head.findViewById(R.id.wifiHeadDetails);
                  String connectedSsid = "";
                  if (ethUp) {
                      headBars.setVisibility(View.GONE);
                      headIcon.setVisibility(View.VISIBLE);
                      headName.setText(R.string.ethernet);
                      headState.setText(R.string.connected);
                      headDetails.setText(ethIp != null ? "IP " + ethIp : "");
                  } else if (wifiUp) {
                      String ssid = "";
                      int level = 3, rssi = 0, speed = -1, freq = 0;
                      try {
                          WifiInfo info = wm != null ? wm.getConnectionInfo() : null;
                          if (info != null) {
                              String raw = info.getSSID();
                              if (raw != null) {
                                  raw = raw.replace("\"", "").trim();
                                  if (!raw.isEmpty() && !raw.contains("unknown") && !raw.equals("0x")) ssid = raw;
                              }
                              rssi = info.getRssi();
                              level = WifiManager.calculateSignalLevel(rssi, 5);
                              speed = info.getLinkSpeed();
                              freq = info.getFrequency();
                          }
                      } catch (Exception ignored) {
                      }
                      connectedSsid = ssid;
                      headBars.setLevel(Math.max(1, level));
                      headName.setText(ssid.isEmpty() ? getString(R.string.wifi) : ssid);
                      headState.setText(R.string.connected);
                      StringBuilder d = new StringBuilder(wifiQuality(level));
                      if (rssi < 0) d.append(" (").append(rssi).append(" dBm)");
                      if (freq > 0) d.append("  ·  ").append(wifiBand(freq));
                      if (speed > 0) d.append("  ·  ").append(speed).append(" Mbps");
                      if (wifiIp != null) d.append("\nIP ").append(wifiIp);
                      headDetails.setText(d.toString());
                  } else {
                      boolean off = false;
                      try {
                          off = wm != null && !wm.isWifiEnabled();
                      } catch (Exception ignored) {
                      }
                      headBars.setLevel(0);
                      headName.setText(off ? wifiText("Wi-Fi désactivé", "Wi-Fi is off") : getString(R.string.offline));
                      headDot.setVisibility(View.GONE);
                      headState.setVisibility(View.GONE);
                      headDetails.setVisibility(View.GONE);
                  }
                  rows.addView(head);
                  addSeparator(rows);

                  // Networks around: the last scan, refreshed when a new one lands.
                  TextView caption = (TextView) getLayoutInflater().inflate(R.layout.item_wifi_caption, rows, false);
                  caption.setText(wifiText("RÉSEAUX À PROXIMITÉ", "NEARBY NETWORKS"));
                  rows.addView(caption);
                  final LinearLayout netRows = new LinearLayout(this);
                  netRows.setOrientation(LinearLayout.VERTICAL);
                  rows.addView(netRows, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));
                  addSeparator(rows);
                  final View manage = addInputRow(rows, popup, R.drawable.ic_wifi,
                          wifiText("Changer de réseau…", "Change network…"), -1,
                          () -> open(systemIntent(Settings.ACTION_WIFI_SETTINGS)));

                  final WifiManager scanner = wm;
                  final String current = connectedSsid;
                  fillWifiNetworks(netRows, popup, scanner, current);
                  final android.content.BroadcastReceiver rx = new android.content.BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (popup.isShowing()) fillWifiNetworks(netRows, popup, scanner, current);
                      }
                  };
                  boolean listening = false;
                  if (wm != null) {
                      try {
                          registerReceiver(rx, new android.content.IntentFilter(WifiManager.SCAN_RESULTS_AVAILABLE_ACTION));
                          listening = true;
                          wm.startScan();
                      } catch (Exception ignored) {
                      }
                  }
                  final boolean unregister = listening;
                  popup.setOnDismissListener(() -> {
                      if (openPopup == popup) openPopup = null;
                      if (unregister) {
                          try {
                              unregisterReceiver(rx);
                          } catch (Exception ignored) {
                          }
                      }
                  });

                  int alignment = getResources().getBoolean(R.bool.rtl_menu_bar) ? Gravity.START : Gravity.END;
                  dropIn(popup, panel, anchor, alignment);
                  View first = netRows.getChildCount() > 0 && netRows.getChildAt(0).isFocusable() ? netRows.getChildAt(0) : manage;
                  first.requestFocus();
              }

              /** Rebuilds the nearby-networks rows from the latest scan, keeping the focus where it was. */
              private void fillWifiNetworks(LinearLayout netRows, PopupWindow popup, WifiManager wm, String connected) {
                  int focused = -1;
                  for (int i = 0; i < netRows.getChildCount(); i++) {
                      if (netRows.getChildAt(i).hasFocus()) focused = i;
                  }
                  netRows.removeAllViews();

                  // One row per network name, strongest first, without the one already shown in the header.
                  List<android.net.wifi.ScanResult> found = new ArrayList<>();
                  try {
                      List<android.net.wifi.ScanResult> scan = wm != null ? wm.getScanResults() : null;
                      if (scan != null) {
                          for (android.net.wifi.ScanResult r : scan) {
                              if (r.SSID == null || r.SSID.trim().isEmpty() || r.SSID.equals(connected)) continue;
                              int dup = -1;
                              for (int i = 0; i < found.size(); i++) {
                                  if (found.get(i).SSID.equals(r.SSID)) dup = i;
                              }
                              if (dup < 0) found.add(r);
                              else if (found.get(dup).level < r.level) found.set(dup, r);
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  Collections.sort(found, (a, b) -> b.level - a.level);

                  if (found.isEmpty()) {
                      TextView none = (TextView) getLayoutInflater().inflate(R.layout.item_wifi_caption, netRows, false);
                      none.setTextSize(13);
                      none.setText(wifiText("Recherche des réseaux…", "Looking for networks…"));
                      netRows.addView(none);
                      return;
                  }
                  for (int i = 0; i < found.size() && i < 6; i++) {
                      android.net.wifi.ScanResult r = found.get(i);
                      View row = getLayoutInflater().inflate(R.layout.item_wifi, netRows, false);
                      ((WifiBars) row.findViewById(R.id.wifiRowBars)).setLevel(WifiManager.calculateSignalLevel(r.level, 5));
                      ((TextView) row.findViewById(R.id.wifiRowTitle)).setText(r.SSID);
                      String caps = r.capabilities != null ? r.capabilities : "";
                      boolean secured = caps.contains("WPA") || caps.contains("WEP") || caps.contains("SAE") || caps.contains("EAP");
                      row.findViewById(R.id.wifiRowLock).setVisibility(secured ? View.VISIBLE : View.GONE);
                      ((TextView) row.findViewById(R.id.wifiRowStatus)).setText(wifiBand(r.frequency));
                      // Joining a network needs the system page: Android 11 keeps that away from apps.
                      row.setOnClickListener(v -> {
                          popup.dismiss();
                          open(systemIntent(Settings.ACTION_WIFI_SETTINGS));
                      });
                      netRows.addView(row);
                  }
                  if (focused >= 0 && netRows.getChildCount() > 0) {
                      netRows.getChildAt(Math.min(focused, netRows.getChildCount() - 1)).requestFocus();
                  }
              }

          '''
          marker = "    // ---- launcher settings and module cards"
          s = once(s, marker, BLOCK + marker, "insert point")
          write(mp, s)
          print("wifi patch applied")
