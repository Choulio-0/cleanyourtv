                   "        try {\n            WindowRedirect.ownLaunch();\n            ctx.startActivity(i);\n            if (cinematic) LastOpened.record(ctx, e.pkg);",
                   "app adapter")
          write(ap, s)

          lp = jdir + "AppLibraryDialog.java"
          s = read(lp)
          s = once(s, "        try { activity.startActivity(intent); }",
                   "        try { WindowRedirect.ownLaunch(); activity.startActivity(intent); }", "library")
          write(lp, s)

          mp = jdir + "MainActivity.java"
          s = read(mp)
          s = once(s, "        i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n        try {\n            startActivity(i);\n        } catch (ActivityNotFoundException | SecurityException e) {",
                   "        i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n        try {\n            WindowRedirect.ownLaunch();\n            startActivity(i);\n        } catch (ActivityNotFoundException | SecurityException e) {",
                   "main open")
          write(mp, s)
