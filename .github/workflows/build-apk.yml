          # ---- 3. what the popup reads: storage, memory, load, temperature, uptime; and the "free up memory" action

          write(jdir + "SystemStats.java", r"""package com.gathin.tvhome;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Environment;
          import android.os.StatFs;
          import android.os.SystemClock;

          import java.io.BufferedReader;
          import java.io.FileReader;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          /** A snapshot of how the TV is doing, for the "This TV" popup. A reading that fails leaves its field empty. */
          final class SystemStats {
              static final int OK = 0, LOW_MEMORY = 1, LOW_STORAGE = 2, SLOW = 3;

              long storageTotal, storageFree;
              long ramTotal, ramAvail;
              boolean lowMemory;
              long uptimeMs;
              float load = -1f;
              int cores = Runtime.getRuntime().availableProcessors();
              int tempC = -1;

              static SystemStats read(Context ctx) {
                  SystemStats s = new SystemStats();
                  try {
                      StatFs fs = new StatFs(Environment.getDataDirectory().getPath());
                      s.storageTotal = fs.getTotalBytes();
                      s.storageFree = fs.getAvailableBytes();
                  } catch (RuntimeException ignored) {
                  }
                  try {
                      ActivityManager am = ctx.getSystemService(ActivityManager.class);
                      ActivityManager.MemoryInfo info = new ActivityManager.MemoryInfo();
                      am.getMemoryInfo(info);
                      s.ramTotal = info.totalMem;
                      s.ramAvail = info.availMem;
                      s.lowMemory = info.lowMemory;
                  } catch (RuntimeException ignored) {
                  }
                  s.uptimeMs = SystemClock.elapsedRealtime();
                  String loadLine = firstLine("/proc/loadavg");
                  if (loadLine != null) {
                      try {
                          s.load = Float.parseFloat(loadLine.trim().split("\\s+")[0]);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  for (int zone = 0; zone < 8 && s.tempC < 0; zone++) {
                      String text = firstLine("/sys/class/thermal/thermal_zone" + zone + "/temp");
                      if (text == null) continue;
                      try {
                          int value = Integer.parseInt(text.trim());
                          if (value > 1000) value /= 1000;
                          if (value >= 10 && value <= 120) s.tempC = value;
                      } catch (NumberFormatException ignored) {
                      }
                  }
                  return s;
              }

              private static String firstLine(String path) {
                  try (BufferedReader reader = new BufferedReader(new FileReader(path))) {
                      return reader.readLine();
                  } catch (Exception e) {
                      return null;
                  }
              }

              int storageUsedPercent() {
                  return storageTotal <= 0 ? -1 : (int) Math.round(100.0 * (storageTotal - storageFree) / storageTotal);
              }

              int ramUsedPercent() {
                  return ramTotal <= 0 ? -1 : (int) Math.round(100.0 * (ramTotal - ramAvail) / ramTotal);
              }

              /** What to tell first: the worst thing found. slowPercent is the share of slow frames, or -1 when not measured. */
              int verdict(int slowPercent) {
                  if (lowMemory || (ramTotal > 0 && ramAvail * 100 < ramTotal * 10)) return LOW_MEMORY;
                  if (storageTotal > 0 && storageFree * 100 < storageTotal * 8) return LOW_STORAGE;
                  if (slowPercent > 20) return SLOW;
                  return OK;
              }

              /** 0 good, 1 careful, 2 bad: which colour a bar gets. */
              static int level(int usedPercent, int warnAt, int badAt) {
                  if (usedPercent < 0) return 0;
                  return usedPercent >= badAt ? 2 : usedPercent >= warnAt ? 1 : 0;
              }

              static String size(long bytes, boolean french) {
                  double mb = bytes / (1024.0 * 1024.0);
                  String mo = french ? "Mo" : "MB";
                  String go = french ? "Go" : "GB";
                  if (mb >= 1024) return String.format(Locale.getDefault(), "%.1f %s", mb / 1024.0, go);
                  return String.format(Locale.getDefault(), "%d %s", Math.round(mb), mo);
              }

              static String duration(long ms, boolean french) {
                  long minutes = ms / 60_000L;
                  long days = minutes / (24 * 60);
                  long hours = (minutes / 60) % 24;
                  long mins = minutes % 60;
                  if (days > 0) return days + (french ? " j " : " d ") + hours + " h";
                  if (hours > 0) return hours + " h " + mins + " min";
                  return mins + " min";
              }

              /** Asks Android to end the apps running in the background, except this one. Whatever is playing keeps playing. */
              static void freeBackground(Context ctx) {
                  try {
                      PackageManager pm = ctx.getPackageManager();
                      ActivityManager am = ctx.getSystemService(ActivityManager.class);
                      Set<String> packages = new HashSet<>();
                      for (String category : new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER}) {
                          Intent intent = new Intent(Intent.ACTION_MAIN).addCategory(category);
                          for (ResolveInfo info : pm.queryIntentActivities(intent, 0)) {
                              if (info.activityInfo != null) packages.add(info.activityInfo.packageName);
                          }
                      }
                      packages.remove(ctx.getPackageName());
                      for (String pkg : packages) am.killBackgroundProcesses(pkg);
                  } catch (RuntimeException ignored) {
                  }
              }
          }
          """)

          # ---- 4. how smoothly the interface runs: frame cadence over 1.5 s while the popup is open

          write(jdir + "FrameMeter.java", r"""package com.gathin.tvhome;

          import android.view.Choreographer;

          /** Counts frames for a short while and reports the rate and the share of slow ones (more than 24 ms apart). */
          final class FrameMeter implements Choreographer.FrameCallback {
              interface Listener {
                  void onResult(int fps, int slowPercent);
              }

              private final long windowMs;
              private final Listener listener;
              private boolean cancelled, started;
              private long first, last;
              private int frames, slow;

              FrameMeter(long windowMs, Listener listener) {
                  this.windowMs = windowMs;
                  this.listener = listener;
              }

              void start() {
                  if (cancelled || started) return;
                  started = true;
                  Choreographer.getInstance().postFrameCallback(this);
              }

              void cancel() {
                  cancelled = true;
              }

              @Override
              public void doFrame(long frameTimeNanos) {
                  if (cancelled) return;
                  if (first == 0) first = frameTimeNanos;
                  if (last != 0) {
                      frames++;
                      if ((frameTimeNanos - last) / 1_000_000.0 > 24.0) slow++;
                  }
                  last = frameTimeNanos;
                  double elapsedMs = (frameTimeNanos - first) / 1_000_000.0;
                  if (elapsedMs < windowMs) {
                      Choreographer.getInstance().postFrameCallback(this);
                      return;
                  }
                  if (frames > 0) listener.onResult((int) Math.round(frames * 1000.0 / elapsedMs), slow * 100 / frames);
              }
          }
          """)

