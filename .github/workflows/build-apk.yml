      - name: Leaner build, French and English only
        run: |
          python3 - <<'PY'
          import sys

          base = "launcher/app/src/main/"


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          # 1. Only French and English go into the APK. The launcher ships 29 translations plus a Hebrew layout; this TV is set
          #    to French, English is the fallback (a theme that forces another language falls back to English).
          gp = "launcher/app/build.gradle"
          g = read(gp)
          g = once(g, "        versionName '3.2'\n",
                   "        versionName '3.2'\n"
                   "        // Only the languages this TV uses: the other translations and the Hebrew layout are never shown.\n"
                   "        resConfigs 'en', 'fr'\n", "languages")
          write(gp, g)

          # 2. A permission that only a Yandex TV (YaOS) needs, for its own TV-source app. Never used on this Hisense.
          mp = base + "AndroidManifest.xml"
          m = read(mp)
          m = once(m, """    <!-- YaOS (Yandex TV OS): HDMI, AV and the tuner all play in com.yandex.tv.live, whose activities require
                   this permission (protection level normal, so it is granted at install). Ignored on other TVs. -->
              <uses-permission android:name="yandex.tv.permission.ACCESS_TV_SOURCE" />
          """, "", "yandex permission")
          write(mp, m)
          print("lean patch applied")
          PY
      - name: Fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          # Every runner makes a new random debug key, so each build had another signature and Android refused to
          # update the installed launcher in place. With the secret DEBUG_KEYSTORE_B64 the same key signs every build.
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -n 2
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret: this build gets a random key (installs will not update in place)"
          fi
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Module Headphones
        continue-on-error: true
        working-directory: addons/headphones
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease
      - name: Module Remote Access
        continue-on-error: true
        working-directory: addons/remote-access
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease
      - name: Module Weather
        continue-on-error: true
        working-directory: addons/weather
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease
      - name: Collect the pack
        run: |
          mkdir -p out
          cp launcher/app/build/outputs/apk/release/app-release.apk out/launcher.apk
          for a in headphones remote-access weather; do
            f=addons/$a/app/build/outputs/apk/release/app-release.apk
            if [ -f "$f" ]; then cp "$f" "out/$a.apk"; else echo "::warning::module $a was not built"; fi
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: tv-pack
          path: out/*.apk
