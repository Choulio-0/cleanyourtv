              private int previewToken;
              /** The picture on screen when a preview started; null while no preview is running. */
              private String beforePreview;

              /** Shows a picture without choosing it, for the picker; endPreview() puts the real one back. */
              void preview(File file) {
                  if (closed) return;
                  if (beforePreview == null) beforePreview = displayed;
                  if (image.getParent() == null) {
                      root.addView(image, 0, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  }
                  decodeAndShow(file, ++previewToken);
              }

              /** The preview of "no wallpaper". */
              void previewNone() {
                  if (closed) return;
                  if (beforePreview == null) beforePreview = displayed;
                  previewToken++;
                  showNothing();
              }

              /** The picker was left without a choice: back to the picture that was on screen. */
              void endPreview() {
                  String name = beforePreview;
                  beforePreview = null;
                  int token = ++previewToken;
                  if (closed || name == null) return;
                  if (name.isEmpty()) {
                      showNothing();
                      return;
                  }
                  for (File candidate : files) {
                      if (candidate.getName().equals(name)) {
                          decodeAndShow(candidate, token);
                          return;
                      }
                  }
              }

              private void decodeAndShow(File file, int token) {
                  try {
                      decoder.execute(() -> {
                          Bitmap bitmap = decode(file);
                          image.post(() -> {
                              if (bitmap == null) return;
                              if (closed || token != previewToken) {
                                  bitmap.recycle();
                                  return;
                              }
                              show(bitmap);
                          });
                      });
                  } catch (java.util.concurrent.RejectedExecutionException ignored) {
