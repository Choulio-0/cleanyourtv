              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          FONT_M = '@string/font_medium'
          FONT_B = '@string/font_body'

          # 1. layouts and drawable of the wallpaper strip
          write(res + "drawable/wallpaper_thumb_bg.xml", """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FF26262B" />
              <corners android:radius="10dp" />
          </shape>
          """)

          write(res + "layout/popup_wallpapers.xml", """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/wpPanel"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/glass_panel"
              android:padding="12dp"
              android:elevation="12dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
