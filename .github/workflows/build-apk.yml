          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;

          import java.io.File;

          /** Small versions of the wallpapers for the picker's cards. */
          final class WallpaperThumbs {
              private WallpaperThumbs() {
              }

              /** The picture reduced to about w x h pixels or more, or null when it cannot be read. */
              static Bitmap load(File file, int w, int h) {
                  try {
                      BitmapFactory.Options options = new BitmapFactory.Options();
                      options.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(file.getPath(), options);
                      if (options.outWidth <= 0 || options.outHeight <= 0) return null;
                      int sample = 1;
                      while (options.outWidth / (sample * 2) >= w && options.outHeight / (sample * 2) >= h) sample *= 2;
                      options.inJustDecodeBounds = false;
                      options.inSampleSize = sample;
                      options.inPreferredConfig = Bitmap.Config.RGB_565;
                      return BitmapFactory.decodeFile(file.getPath(), options);
                  } catch (Exception | OutOfMemoryError failure) {
                      return null;
                  }
              }
          }
