      - name: Play Store button redirect
        run: |
          python3 - <<'PY'
          import sys

          base = "launcher/app/src/main/"
          jdir = base + "java/com/gathin/tvhome/"


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          # 1. WindowRedirect: app_keys "window:<package>:<target>" entries
          write(jdir + "WindowRedirect.java", """package com.gathin.tvhome;

          import android.os.SystemClock;

          import java.util.HashMap;
          import java.util.Map;

          /**
           * app_keys "window:<package>:<target>" entries, for a remote button that the firmware answers below Android
           * (the Play Store button): when <package> comes up by itself, <target> is opened instead. Nothing filters keys,
           * so a held volume key keeps ramping. Anything this launcher opens itself (a dock tile, the app library) is left
           * alone for a few seconds, so the Play Store tile still opens the Play Store.
           */
          final class WindowRedirect {
              /** How long after the launcher opens an app a window change is the launcher's own doing. */
              static final long OWN_LAUNCH_MS = 6000;
              /** Minimum gap between two redirects, so the window that comes up with the target never loops. */
              static final long COOLDOWN_MS = 4000;

              private static volatile long ownLaunchUntil;

              private WindowRedirect() {
              }

              /** The launcher is about to open an app itself. */
              static void ownLaunch() {
                  ownLaunchUntil = SystemClock.elapsedRealtime() + OWN_LAUNCH_MS;
              }

              /** package -> target from the "window:" entries; other entries are skipped. */
              static Map<String, String> parse(Iterable<String> entries) {
                  Map<String, String> map = new HashMap<>();
                  for (String entry : entries) {
                      if (entry == null) continue;
                      String text = entry.trim();
                      if (!text.startsWith("window:")) continue;
                      String[] parts = text.substring("window:".length()).split(":", 2);
                      if (parts.length != 2) continue;
                      String from = parts[0].trim(), to = parts[1].trim();
                      if (!from.isEmpty() && !to.isEmpty()) map.put(from, to);
                  }
                  return map;
              }

              /** Whether a redirect may run now: not right after an own launch, not right after the last redirect. */
              static boolean due(long now, long lastRedirect) {
                  return now >= ownLaunchUntil && (lastRedirect == 0 || now - lastRedirect >= COOLDOWN_MS);
              }
          }
          """)

          # 2. InputKeyService: watch window changes and open the target
          ip = jdir + "InputKeyService.java"
          s = read(ip)
          s = once(s, "    private boolean consumeVolumeKeys;\n",
                   "    private boolean consumeVolumeKeys;\n"
                   "    /** app_keys \"window:\" entries: a package the firmware opens by itself, and what to open instead. */\n"
                   "    private Map<String, String> windowRedirects = Collections.emptyMap();\n"
                   "    private long lastRedirect;\n", "field")
          s = once(s, "        RemoteKeys.applyKeyFilter(this, config.keyFilter);\n",
                   "        RemoteKeys.applyKeyFilter(this, config.keyFilter);\n"
                   "        windowRedirects = WindowRedirect.parse(config.appKeys);\n"
                   "        if (!windowRedirects.isEmpty()) {\n"
                   "            // input_key_service.xml subscribes to no events; window changes are only wanted for these entries.\n"
                   "            android.accessibilityservice.AccessibilityServiceInfo info = getServiceInfo();\n"
                   "            if (info != null) {\n"
                   "                info.eventTypes |= AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED;\n"
                   "                setServiceInfo(info);\n"
                   "            }\n"
                   "        }\n", "connected")
          s = once(s, "    public void onAccessibilityEvent(AccessibilityEvent event) {\n    }\n",
                   "    public void onAccessibilityEvent(AccessibilityEvent event) {\n"
                   "        if (windowRedirects.isEmpty() || event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;\n"
                   "        CharSequence pkg = event.getPackageName();\n"
                   "        String target = pkg == null ? null : windowRedirects.get(pkg.toString());\n"
                   "        if (target == null) return;\n"
                   "        long now = android.os.SystemClock.elapsedRealtime();\n"
                   "        if (!WindowRedirect.due(now, lastRedirect)) return;\n"
                   "        lastRedirect = now;\n"
                   "        RemoteKeys.launch(this, target);\n"
                   "    }\n", "event")
