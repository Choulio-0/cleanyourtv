          BLOCK = r'''    // ---- Wallpaper strip: pick a wallpaper with a live preview ------------------------------------------

              private String wallpaperLabel(java.io.File file) {
                  String name = file.getName();
                  if (name.equals(Config.WALLPAPER_NAME)) return wifiText("Fond du thème", "Theme wallpaper");
                  int dot = name.lastIndexOf('.');
                  if (dot > 0) name = name.substring(0, dot);
                  return name.replace('_', ' ').replace('-', ' ');
              }

              private void showWallpaperStrip() {
                  java.io.File dir = Config.dir(this);
                  final List<java.io.File> images = new ArrayList<>(
                          WallpaperRotation.images(dir == null ? null : new java.io.File(dir, "wallpapers")));
                  // A theme with a single wallpaper.jpg offers that picture too (Config maps the choice back to it).
                  java.io.File single = dir == null ? null : new java.io.File(dir, Config.WALLPAPER_NAME);
                  if (single != null && single.isFile()) images.add(0, single);
                  final android.content.SharedPreferences choices = getSharedPreferences(Config.SETTINGS_NAME, MODE_PRIVATE);
                  final String current = choices.getString(Config.WALLPAPER_CHOICE_KEY, null);

                  View panel = getLayoutInflater().inflate(R.layout.popup_wallpapers, root, false);
                  ((TextView) panel.findViewById(R.id.wpTitle)).setText(wifiText("Fond d'écran", getString(R.string.wallpaper_label)));
                  ((TextView) panel.findViewById(R.id.wpHint)).setText(
                          wifiText("OK : choisir   ·   Retour : annuler", "OK: apply   ·   Back: cancel"));
                  final LinearLayout row = panel.findViewById(R.id.wpRow);
                  int width = getResources().getDisplayMetrics().widthPixels - (int) (56 * density);
                  final PopupWindow popup = glassPopup(panel, width);
                  final boolean[] applied = {false};
                  final Runnable[] pending = {null};
                  final List<ImageView> thumbViews = new ArrayList<>();
                  final List<java.io.File> thumbFiles = new ArrayList<>();

                  // Pictures first, then "none", then (only once a choice was made) the way back to what the theme decides.
                  final boolean offerTheme = current != null;
                  final boolean[] settling = {true};   // the card that starts focused shows what is already on screen
                  int focusIndex = 0;
                  for (int i = 0; i < images.size() + 1 + (offerTheme ? 1 : 0); i++) {
                      final boolean none = i == images.size();
                      final boolean theme = i > images.size();
                      final java.io.File file = i < images.size() ? images.get(i) : null;
                      View card = getLayoutInflater().inflate(R.layout.item_wallpaper, row, false);
                      ImageView thumb = card.findViewById(R.id.wpThumb);
                      ((TextView) card.findViewById(R.id.wpName)).setText(
                              theme ? wifiText("Thème d'origine", getString(R.string.wallpaper_theme_default))
                                      : none ? wifiText("Aucun fond", getString(R.string.wallpaper_none)) : wallpaperLabel(file));
                      boolean isCurrent = file != null ? file.getName().equals(current)
                              : none && WallpaperRotation.CHOICE_NONE.equals(current);
                      card.findViewById(R.id.wpCurrent).setVisibility(isCurrent ? View.VISIBLE : View.GONE);
                      if (isCurrent) focusIndex = i;
                      if (file == null) {
                          thumb.setScaleType(ImageView.ScaleType.CENTER);
                          thumb.setImageResource(R.drawable.ic_wallpaper);
                      } else {
                          thumbViews.add(thumb);
                          thumbFiles.add(file);
                      }
                      // Focus is the preview: the real wallpaper changes behind the strip as the cursor moves.
                      card.setOnFocusChangeListener((v, hasFocus) -> {
                          if (!hasFocus || settling[0]) return;
                          if (pending[0] != null) root.removeCallbacks(pending[0]);
                          pending[0] = () -> {
                              if (file != null) wallpaperPlayer.preview(file);
                              else if (theme && single != null && single.isFile()) wallpaperPlayer.preview(single);
                              else wallpaperPlayer.previewNone();
                          };
                          root.postDelayed(pending[0], 150);
                      });
                      card.setOnClickListener(v -> {
                          applied[0] = true;
                          android.content.SharedPreferences.Editor edit = choices.edit();
                          if (theme) edit.remove(Config.WALLPAPER_CHOICE_KEY);
                          else edit.putString(Config.WALLPAPER_CHOICE_KEY, none ? WallpaperRotation.CHOICE_NONE : file.getName());
                          edit.putLong(Config.SETTINGS_REVISION_KEY, choices.getLong(Config.SETTINGS_REVISION_KEY, 0) + 1).apply();
                          popup.dismiss();
                          Toast.makeText(this, R.string.wallpaper_applied, Toast.LENGTH_SHORT).show();
                          recreate();
                      });
                      row.addView(card);
                  }

                  final int thumbW = (int) (168 * density), thumbH = (int) (94 * density);
                  new Thread(() -> {
                      for (int i = 0; i < thumbFiles.size(); i++) {
                          final android.graphics.Bitmap bitmap = WallpaperThumbs.load(thumbFiles.get(i), thumbW, thumbH);
                          final ImageView target = thumbViews.get(i);
                          if (bitmap != null) target.post(() -> target.setImageBitmap(bitmap));
                      }
                  }, "wallpaper-thumbs").start();

                  popup.setOnDismissListener(() -> {
                      if (openPopup == popup) openPopup = null;
                      if (pending[0] != null) root.removeCallbacks(pending[0]);
                      if (!applied[0]) wallpaperPlayer.endPreview();
                  });

                  panel.setAlpha(0f);
                  panel.setTranslationY(24 * density);
                  popup.showAtLocation(root, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL, 0, (int) (24 * density));
                  panel.animate().alpha(1f).translationY(0f).setDuration(reducedMotion ? Motion.REDUCED_MS : 220)
                          .setInterpolator(new android.view.animation.DecelerateInterpolator(1.6f)).start();
                  row.getChildAt(Math.min(focusIndex, row.getChildCount() - 1)).requestFocus();
                  settling[0] = false;
              }

          '''
          marker = "    // ---- launcher settings and module cards"
          s = once(s, marker, BLOCK + marker, "insert point")
          write(mp, s)
          print("wallpaper strip patch applied")
          PY
