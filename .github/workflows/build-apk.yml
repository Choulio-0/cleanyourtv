          # ---- 1. A listener service whose only job is to let the launcher read the active media sessions (Spotify, YouTube...).
          #         Android hands session access to an enabled notification listener; this one reads no notification.
          write(jdir + "MediaListener.java", r"""package com.gathin.tvhome;

          import android.service.notification.NotificationListenerService;

          /**
           * Never reads a notification. It exists so the launcher may ask the system for the active media sessions
           * (NowPlaying); the owner turns it on once: cmd notification allow_listener com.gathin.tvhome/.MediaListener
           */
          public class MediaListener extends NotificationListenerService {
          }
          """)

          # ---- 2. What is playing: title, artist, playing or paused, and a play/pause toggle
          write(jdir + "NowPlaying.java", r"""package com.gathin.tvhome;

          import android.content.ComponentName;
          import android.content.Context;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.os.Handler;

          import java.util.ArrayList;
          import java.util.List;

          /** The media playing on the TV right now, read from the active media sessions while Home is on screen. */
          final class NowPlaying {
              interface Listener {
                  void onChanged();
              }

              private final Context ctx;
              private final Handler main;
              private final Listener listener;
              private final List<MediaController> controllers = new ArrayList<>();
              private MediaSessionManager manager;
              private ComponentName component;
              private MediaController current;
              private boolean running;

              String title = "";
              String artist = "";
              boolean playing;

              private final MediaSessionManager.OnActiveSessionsChangedListener sessions = this::rebuild;
              private final MediaController.Callback callback = new MediaController.Callback() {
                  @Override
                  public void onPlaybackStateChanged(PlaybackState state) {
                      pick();
                  }

                  @Override
                  public void onMetadataChanged(MediaMetadata metadata) {
                      pick();
                  }
              };

              NowPlaying(Context ctx, Handler main, Listener listener) {
                  this.ctx = ctx;
                  this.main = main;
                  this.listener = listener;
              }

              /** Starts listening; quietly does nothing until the owner has allowed MediaListener. */
              void start() {
                  if (running) return;
                  try {
                      manager = ctx.getSystemService(MediaSessionManager.class);
                      component = new ComponentName(ctx, MediaListener.class);
                      manager.addOnActiveSessionsChangedListener(sessions, component, main);
                      running = true;
                      rebuild(manager.getActiveSessions(component));
                  } catch (RuntimeException e) {
                      running = false;
                      clear();
                  }
              }

              void stop() {
                  if (!running) return;
                  running = false;
                  try {
                      manager.removeOnActiveSessionsChangedListener(sessions);
                  } catch (RuntimeException ignored) {
                  }
                  for (MediaController c : controllers) c.unregisterCallback(callback);
                  controllers.clear();
                  current = null;
                  clear();
              }

              /** Pauses what plays, or plays what is paused. */
              void toggle() {
                  MediaController c = current;
                  if (c == null) return;
                  try {
                      if (playing) c.getTransportControls().pause();
                      else c.getTransportControls().play();
                  } catch (RuntimeException ignored) {
                  }
              }

              boolean has() {
                  return !title.isEmpty();
              }

              /** "Title  ·  Artist", or just the title. */
              String line() {
                  return artist.isEmpty() ? title : title + "  ·  " + artist;
              }

              private void rebuild(List<MediaController> list) {
                  for (MediaController c : controllers) c.unregisterCallback(callback);
                  controllers.clear();
                  if (list != null) {
                      for (MediaController c : list) {
                          controllers.add(c);
                          c.registerCallback(callback, main);
                      }
                  }
                  pick();
              }

              private void pick() {
                  MediaController best = null;
                  for (MediaController c : controllers) {
                      PlaybackState st = c.getPlaybackState();
                      if (st == null) continue;
                      if (st.getState() == PlaybackState.STATE_PLAYING) {
                          best = c;
                          break;
                      }
                      if (best == null && st.getState() == PlaybackState.STATE_PAUSED && text(c, MediaMetadata.METADATA_KEY_TITLE).length() > 0) {
                          best = c;
                      }
                  }
                  String newTitle = "", newArtist = "";
                  boolean nowPlaying = false;
                  if (best != null) {
                      newTitle = text(best, MediaMetadata.METADATA_KEY_TITLE);
                      newArtist = text(best, MediaMetadata.METADATA_KEY_ARTIST);
                      if (newArtist.isEmpty()) newArtist = text(best, MediaMetadata.METADATA_KEY_ALBUM_ARTIST);
                      PlaybackState st = best.getPlaybackState();
                      nowPlaying = st != null && st.getState() == PlaybackState.STATE_PLAYING;
                  }
                  current = best;
                  if (newTitle.equals(title) && newArtist.equals(artist) && nowPlaying == playing) return;
                  title = newTitle;
                  artist = newArtist;
                  playing = nowPlaying;
                  listener.onChanged();
              }

              private void clear() {
                  boolean changed = has() || playing;
                  title = "";
                  artist = "";
                  playing = false;
                  if (changed) listener.onChanged();
              }

              private static String text(MediaController c, String key) {
                  try {
                      MediaMetadata m = c.getMetadata();
                      CharSequence s = m == null ? null : m.getText(key);
                      return s == null ? "" : s.toString().trim();
                  } catch (RuntimeException e) {
                      return "";
                  }
              }
          }
