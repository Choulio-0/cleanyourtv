      - name: Start-up intro video
        run: |
          python3 - <<'PY'
          import sys

          base = "launcher/app/src/main/"
          jdir = base + "java/com/gathin/tvhome/"


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(text, old, new, label):
              if text.count(old) != 1:
                  sys.exit("PATCH FAILED: " + label)
              return text.replace(old, new)


          # 1. the clip is pushed like the theme's own files
          tp = jdir + "ThemeFiles.java"
          s = read(tp)
          s = once(s, '"wallpaper.jpg".equals(name) || "theme_revision".equals(name)',
                   '"wallpaper.jpg".equals(name) || "theme_revision".equals(name) || "intro.mp4".equals(name)', "theme files")
          write(tp, s)

          # 2. the intro plays inside Home itself, on top of it: a separate activity was swept away by the second HOME
          #    intent the firmware sends a few seconds after start-up (Home is singleTask), which cut it after half a second
          write(jdir + "IntroOverlay.java", """package com.gathin.tvhome;

          import android.content.Context;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.VideoView;

          import java.io.File;

          /**
           * The start-up intro: intro.mp4 from the theme folder, with its sound, over Home. It lives inside Home's own window, above its whole layout,
           * so the HOME intents the firmware sends after power-on cannot close it. MainActivity ends it on any key (the volume
           * keys still work), when the clip finishes, or when Home is left.
           */
          final class IntroOverlay {
              static final String FILE_NAME = "intro.mp4";

              private final ViewGroup host;
              private final FrameLayout layer;
              private final VideoView video;
              private boolean ended;

              /** The pushed clip, or null when there is none. */
              static File clip(Context ctx) {
                  File dir = Config.dir(ctx);
                  if (dir == null) return null;
                  File file = new File(dir, FILE_NAME);
                  return file.isFile() && file.length() > 0 ? file : null;
              }

              /** Starts the intro on top of host; null when there is no clip. */
              static IntroOverlay show(Context ctx, ViewGroup host) {
                  File file = clip(ctx);
                  return file == null ? null : new IntroOverlay(ctx, host, file);
              }

              private IntroOverlay(Context ctx, ViewGroup host, File file) {
                  this.host = host;
                  layer = new FrameLayout(ctx);
                  layer.setBackgroundColor(0xFF000000);
                  layer.setClickable(true);
                  video = new VideoView(ctx);
                  layer.addView(video, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT, Gravity.CENTER));
                  host.addView(layer, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  video.setOnCompletionListener(player -> end());
                  video.setOnErrorListener((player, what, extra) -> {
                      end();
                      return true;
                  });
                  video.setVideoPath(file.getPath());
                  video.start();
              }

              boolean showing() {
                  return !ended;
              }

              void end() {
                  if (ended) return;
                  ended = true;
                  try {
                      video.stopPlayback();
                  } catch (RuntimeException ignored) {
                  }
                  layer.animate().alpha(0f).setDuration(300).withEndAction(() -> host.removeView(layer)).start();
              }
          }
          """)

          # 3. Home starts it, once per process and only just after power-on; --ez intro true starts it on demand
          hp = jdir + "MainActivity.java"
          s = read(hp)
          s = once(s, "    private View btnReorder;\n",
                   "    private View btnReorder;\n    private static boolean introChecked;\n    private IntroOverlay intro;\n", "intro fields")
          s = once(s, "        root.setBackgroundColor(cfg.backgroundColor);\n",
                   "        root.setBackgroundColor(cfg.backgroundColor);\n"
                   "        if (!introChecked) {\n"
                   "            introChecked = true;\n"
                   "            // Only when the TV has just powered on: a reinstall, a theme push or a crash restart is not a start-up.\n"
                   "            // Added to the window's content frame, above Home's whole layout and before its first frame: no flash of Home.\n"
                   "            if (savedInstanceState == null && SystemClock.elapsedRealtime() < 5 * 60_000L) startIntro();\n"
                   "        }\n", "intro start")
          s = once(s, "    // ---- Wallpaper strip: pick a wallpaper with a live preview",
                   '''    /** Plays intro.mp4 over Home (IntroOverlay); nothing when the theme has no clip. */
              private void startIntro() {
                  if (isFinishing() || isDestroyed()) return;
                  if (intro != null) intro.end();
                  intro = IntroOverlay.show(this, (ViewGroup) root.getParent());
              }

              // ---- Wallpaper strip: pick a wallpaper with a live preview''', "intro method")
          s = once(s, "        // Vendor keys (TCL Netflix button, 4062) never reach the key services, only the focused window.\n",
                   "        if (intro != null && intro.showing()) {\n"
                   "            // Any key skips the intro; the volume keys still change the volume.\n"
                   "            int key = event.getKeyCode();\n"
                   "            if (key == KeyEvent.KEYCODE_VOLUME_UP || key == KeyEvent.KEYCODE_VOLUME_DOWN\n"
                   "                    || key == KeyEvent.KEYCODE_VOLUME_MUTE) return super.dispatchKeyEvent(event);\n"
                   "            if (event.getAction() == KeyEvent.ACTION_UP) intro.end();\n"
                   "            return true;\n"
                   "        }\n"
                   "        // Vendor keys (TCL Netflix button, 4062) never reach the key services, only the focused window.\n", "intro keys")
          s = once(s, "        super.onNewIntent(intent);\n        if (openLauncherSettingsIfAsked(intent)) return;",
                   "        super.onNewIntent(intent);\n"
                   "        // am start -n com.gathin.tvhome/.MainActivity --ez intro true: play the intro now, to try a clip.\n"
                   "        if (intent != null && intent.getBooleanExtra(\"intro\", false)) {\n"
                   "            startIntro();\n"
                   "            return;\n"
                   "        }\n"
                   "        if (openLauncherSettingsIfAsked(intent)) return;", "intro new intent")
          s = once(s, "        super.onStop();\n        started = false;\n",
                   "        super.onStop();\n        if (intro != null) intro.end();\n        started = false;\n", "intro stop")
          s = once(s, "        super.onDestroy();\n        if (gameDay != null) gameDay.shutdown();\n",
                   "        super.onDestroy();\n        if (intro != null) intro.end();\n        if (gameDay != null) gameDay.shutdown();\n", "intro destroy")
          write(hp, s)
          print("intro patch applied")
